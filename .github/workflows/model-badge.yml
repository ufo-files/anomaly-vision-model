name: Update model label badge
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model-label-badge
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            badges
      - name: Read the latest published crop count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          gh release download "$tag" --pattern labels-badge.json --dir "$RUNNER_TEMP/model-badge"
          python3 scripts/render_labels_badge.py "$RUNNER_TEMP/model-badge/labels-badge.json" badges/cropped-labels.svg
      - name: Publish badge when the count changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/cropped-labels.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update published model crop-count badge"
            git push origin HEAD:main
          fi
